set timeout=3
set default=0

menuentry "Lamp OS (Kernel+Initrd)" {
    set root=(cd0)
    linux /boot/vmlinuz quiet splash
    initrd /boot/initrd.img
}

menuentry "Lamp OS (Legacy Chainload)" {
    set root=(cd0)
    chainloader +1
    boot
}

# UEFI direct kernel boot examples for aarch64 may require different kernel names

