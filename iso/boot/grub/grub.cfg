set timeout=3
set default=0
set hidden_menu

# enable serial console for grub
serial --unit=0 --speed=115200
terminal_input serial
terminal_output serial

menuentry "Lamp OS" {
    echo "Loading Lamp OS..."
    linux /live/vmlinuz console=ttyS0,115200 console=tty0 loglevel=7 earlyprintk=serial,ttyS0,115200 ro rdinit=/bin/init
    echo "Booting kernel..."
    initrd /live/initrd.img
    boot
}

menuentry "Lamp OS (Text Mode)" {
    linux /live/vmlinuz console=ttyS0,115200 console=tty0 loglevel=7 earlyprintk=serial,ttyS0,115200
    initrd /live/initrd.img
    boot
}
