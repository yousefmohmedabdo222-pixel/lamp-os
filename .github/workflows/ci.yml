name: CI

on:
  push:
    branches: [ main, multi-arch-support ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc make bc wget curl git pkg-config \
            xorriso grub-pc-bin grub-efi-amd64-bin \
            qemu-system-x86 qemu-utils qemu-user-static \
            cpio dosfstools parted e2fsprogs python3 python3-pip

      - name: Ensure scripts are executable
        run: |
          chmod +x build.sh build_kernel.sh build_initrd.sh create_iso.sh scripts/*.sh || true

      - name: Build quick (kernel + initrd + iso)
        run: ./build.sh quick

      - name: Run QEMU smoke test (x86_64)
        run: |
          set -o pipefail
          timeout 60s qemu-system-x86_64 -cdrom lamp-os.iso -m 512 -nographic -serial file:boot.log || true
          echo "---- boot.log ----"
          tail -n +1 boot.log || true
          echo "------------------"
          # Fail if boot message not found
          if ! grep -iq "Lamp OS boot complete" boot.log; then
            echo "Boot log did not contain the expected success message." >&2
            exit 2
          fi

      - name: Upload boot log
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: boot.log
